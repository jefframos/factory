<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mow Town Editor</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<header id="topbar">
  <div class="brand"><span class="logo">M</span> Mow Town Editor</div>
  <label id="levelPicker" title="The city whose level you're editing (Town tab; ▶ Play opens the game in it)">Editing <select id="levelSelect"></select></label>
  <nav id="tabs">
    <button data-tab="town" class="tab active">🏙 Town</button>
    <button data-tab="tractor" class="tab">🚜 Tractor</button>
    <button data-tab="mowers" class="tab">🧹 Mowers</button>
    <button data-tab="mapshots" class="tab">📸 Map shots</button>
  </nav>
</header>

<section id="tab-town" class="tab-panel workspace"></section>

<section id="tab-tractor" class="tab-panel workspace" hidden></section>

<section id="tab-mowers" class="tab-panel workspace" hidden></section>

<section id="tab-mapshots" class="tab-panel mapshots" hidden></section>

<div id="toast"></div>
<script type="module">
import { api } from './shared.js';
import { setModelCatalog } from './modelPicker.js';
import { initTownTab, hasUnsavedTown, loadTown } from './town3d.js';
import { initTractorTab, refreshTractorTab, hasUnsavedTractorChanges } from './tractor.js';
import { initMowersTab, refreshMowersTab, hasUnsavedMowerChanges } from './mowers.js';
import { initMapShotsTab, refreshMapShotsTab, hasUnsavedMapShots } from './mapshots.js';

const config = await api('/api/config');
setModelCatalog(await api('/api/models'));
// The level being edited: picked in the top bar, remembered; each city's own file (levels/<level>.json).
const levels = await api('/api/levels');
const levelSelect = document.getElementById('levelSelect');
let level = levels.find((entry) => entry.level === localStorage.getItem('mowEditor.level')) ?? levels.find((entry) => entry.level === 'town') ?? levels[0];
levelSelect.append(...levels.map((entry) => new Option(`${entry.name}  (${entry.level}.json)`, entry.level)));
levelSelect.value = level.level;
const levelUrl = (entry) => `/api/town?level=${encodeURIComponent(entry.level)}`;
await initTownTab(document.getElementById('tab-town'), { gameUrl: config.gameUrl, townUrl: levelUrl(level), city: level.id });
levelSelect.addEventListener('change', async () => {
    const next = levels.find((entry) => entry.level === levelSelect.value);
    if (hasUnsavedTown() && !window.confirm(`Unsaved changes in ${level.name}: switch to ${next.name} and lose them?`)) {
        levelSelect.value = level.level;
        return;
    }
    level = next;
    localStorage.setItem('mowEditor.level', level.level);
    await loadTown(levelUrl(level), level.id);
    if (mapShotsReady) await refreshMapShotsTab(level);
});
let tractorReady = false;
let mowersReady = false;
let mapShotsReady = false;

// Tabs: one panel shown at a time; the Tractor and Mowers tabs are built the first time they're opened.
for (const button of document.querySelectorAll('#tabs .tab')) {
    button.addEventListener('click', async () => {
        const tab = button.dataset.tab;
        document.querySelectorAll('#tabs .tab').forEach((other) => other.classList.toggle('active', other === button));
        document.querySelectorAll('.tab-panel').forEach((panel) => { panel.hidden = panel.id !== `tab-${tab}`; });
        if (tab === 'tractor') {
            if (!tractorReady) {
                tractorReady = true;
                await initTractorTab(document.getElementById('tab-tractor'));
            } else {
                refreshTractorTab();
            }
        }
        if (tab === 'mapshots') {
            if (!mapShotsReady) {
                mapShotsReady = true;
                await initMapShotsTab(document.getElementById('tab-mapshots'), { gameUrl: config.gameUrl, city: level });
            } else {
                await refreshMapShotsTab(level);
            }
        }
        if (tab === 'mowers') {
            if (!mowersReady) {
                mowersReady = true;
                await initMowersTab(document.getElementById('tab-mowers'));
            } else {
                refreshMowersTab();
            }
        }
    });
}
window.addEventListener('beforeunload', (event) => {
    if (hasUnsavedTown() || hasUnsavedTractorChanges() || hasUnsavedMowerChanges() || hasUnsavedMapShots()) event.preventDefault();
});
</script>
</body>
</html>
