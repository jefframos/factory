<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mob editor</title>
    <!-- The shared editor modules (model / library pickers) need three, and their modal styles. -->
    <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }</script>
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --bg: #14172a; --panel: #1d2140; --panel2: #262b52; --line: #353b6b; --text: #e8ebff; --dim: #9aa2d6;
            --accent: #4f8cff; --danger: #ff4f63; --ok: #45c46a;
        }
        * { box-sizing: border-box; }
        body { margin: 0; font: 13px/1.35 system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
        header h1 { font-size: 15px; margin: 0 14px 0 0; }
        button, select, input { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
        button { cursor: pointer; }
        button:hover { border-color: var(--accent); }
        button.on { background: var(--accent); border-color: var(--accent); }
        button.primary { background: var(--accent); border-color: var(--accent); }
        button.danger { border-color: var(--danger); color: #ffb3bb; }
        input[type=number] { width: 78px; }
        .tab-panel { flex: 1; display: flex; min-height: 0; }
        .tab-panel[hidden] { display: none; }
        aside { width: 210px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
        aside .list { flex: 1; overflow: auto; }
        aside .row { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid #23284a; display: flex; justify-content: space-between; gap: 6px; }
        aside .row:hover { background: var(--panel2); }
        aside .row.sel { background: #2f3a7a; }
        aside .row small { color: var(--dim); }
        aside .tools { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-top: 1px solid var(--line); }
        .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line); align-items: center; }
        .toolbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
        .work { flex: 1; display: flex; min-height: 0; }
        .canvas-wrap { flex: 1; position: relative; min-width: 0; }
        canvas#field { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
        .props { width: 270px; background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding: 10px; }
        .props h3 { margin: 4px 0 8px; font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
        .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; }
        .field label { color: var(--dim); }
        .field input[type=text] { width: 150px; }
        .hint { color: var(--dim); font-size: 12px; margin: 8px 0; }
        .preview { width: 380px; display: flex; flex-direction: column; border-left: 1px solid var(--line); background: #000; }
        .preview .bar { display: flex; gap: 6px; padding: 6px; background: var(--panel); align-items: center; }
        .preview iframe { flex: 1; border: 0; width: 100%; background: #0b0d1a; }
        #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; pointer-events: none; }
        #toast.show { opacity: 1; }
        #toast.error { border-color: var(--danger); }
        #toast.ok { border-color: var(--ok); }
        .zones { flex: 1; overflow: auto; padding: 14px; display: flex; gap: 14px; align-items: flex-start; }
        .zone { width: 290px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
        .zone .lv { display: flex; align-items: center; gap: 4px; padding: 3px 0; border-bottom: 1px solid #23284a; }
        .zone .lv span { flex: 1; }
        .zone .lv button { padding: 1px 6px; }
        .dirty::after { content: ' •'; color: #ffcf4a; }
        header { flex: none; }
        .theme-form { flex: 1; overflow: auto; padding: 12px 16px; max-width: 560px; }
        .theme-form h3 { margin: 16px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
        .theme-form input[type=color] { width: 54px; height: 26px; padding: 0 2px; }
        .prop-row { display: grid; grid-template-columns: 1fr 70px 60px auto auto auto; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid #23284a; }
        .prop-row code { font-size: 11px; color: #cfd6ff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <header>
        <h1>Mob editor</h1>
        <button data-tab="levels" class="on">Levels</button>
        <button data-tab="zones">Zones</button>
        <button data-tab="themes">Themes</button>
        <button data-tab="units">Units</button>
        <span style="flex:1"></span>
        <span id="status" class="hint"></span>
    </header>
    <section id="tab-levels" class="tab-panel"></section>
    <section id="tab-zones" class="tab-panel" hidden></section>
    <section id="tab-themes" class="tab-panel" hidden></section>
    <section id="tab-units" class="tab-panel" hidden></section>
    <div id="toast"></div>
    <script type="module" src="./mob-editor.js"></script>
</body>
</html>
