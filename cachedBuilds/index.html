<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            background:
                radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.12) 1.5px, transparent 0) 0 0 / 28px 28px,
                linear-gradient(160deg, #ff7a59 0%, #ff4f8b 38%, #7b4dff 100%) fixed;
            padding: 28px 16px 56px;
        }
        header {
            max-width: 1100px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: #fff;
            color: #ff4f8b;
            display: grid;
            place-items: center;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
        }
        h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 700;
            text-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
        }
        .grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 22px 18px;
        }
        .game {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .tile {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 26px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.14), 0 14px 28px rgba(40, 0, 60, 0.28);
            border: 4px solid #fff;
            transition: transform 0.18s cubic-bezier(.3, 1.6, .5, 1), box-shadow 0.18s ease;
        }
        .tile img, .letter {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        .letter {
            display: grid;
            place-items: center;
            font-size: 64px;
            font-weight: 700;
            text-shadow: 0 4px 0 rgba(0, 0, 0, 0.18);
        }
        .game:hover .tile, .game:focus-visible .tile {
            transform: translateY(-6px) scale(1.05) rotate(-1.5deg);
            box-shadow: 0 14px 0 rgba(0, 0, 0, 0.12), 0 22px 36px rgba(40, 0, 60, 0.35);
        }
        .name {
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
        }
        .settings {
            margin-left: auto;
            position: relative;
        }
        .settings-button {
            width: 52px;
            height: 52px;
            border: 0;
            border-radius: 16px;
            background: #fff;
            color: #7b4dff;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12);
            transition: transform 0.15s ease;
        }
        .settings-button:hover { transform: rotate(30deg); }
        .settings-button svg { width: 28px; height: 28px; }
        .menu {
            position: absolute;
            top: 62px;
            right: 0;
            min-width: 200px;
            background: #fff;
            border-radius: 16px;
            padding: 8px;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12), 0 16px 32px rgba(40, 0, 60, 0.3);
            z-index: 10;
        }
        .menu[hidden] { display: none; }
        .menu a {
            display: block;
            padding: 12px 14px;
            border-radius: 10px;
            color: #3b2a6b;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
        }
        .menu a:hover { background: #f1ecff; }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 16px 12px; }
            .tile { border-radius: 20px; border-width: 3px; }
            .name { font-size: 15px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">▶</div>
        <h1>Games</h1>
        <div class="settings">
            <button class="settings-button" type="button" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
            <nav class="menu" hidden>
                <a href="./all/">Prototypes</a>
            </nav>
        </div>
    </header>
    <div class="grid">
        <a class="game" href="./play.html?game=down">
            <span class="tile"><img src="./icons/down.webp" alt="" loading="lazy" /></span>
            <span class="name">Pop Cat</span>
        </a>
        <a class="game" href="./play.html?game=dig">
            <span class="tile"><img src="./icons/dig.webp" alt="" loading="lazy" /></span>
            <span class="name">Dig and Discover</span>
        </a>
        <a class="game" href="./play.html?game=clog">
            <span class="tile"><img src="./icons/clog.webp" alt="" loading="lazy" /></span>
            <span class="name">Whale.io</span>
        </a>
        <a class="game" href="./play.html?game=ant">
            <span class="tile"><img src="./icons/ant.webp" alt="" loading="lazy" /></span>
            <span class="name">Ant</span>
        </a>
        <a class="game" href="./play.html?game=merge1">
            <span class="tile"><img src="./icons/merge1.webp" alt="" loading="lazy" /></span>
            <span class="name">Cat Garden</span>
        </a>
        <a class="game" href="./play.html?game=hex">
            <span class="tile"><img src="./icons/hex.webp" alt="" loading="lazy" /></span>
            <span class="name">Hex Merge</span>
        </a>
        <a class="game" href="./play.html?game=mow">
            <span class="tile"><img src="./icons/mow.webp" alt="" loading="lazy" /></span>
            <span class="name">Mow</span>
        </a>
        <a class="game" href="./play.html?game=tower">
            <span class="tile"><img src="./icons/tower.webp" alt="" loading="lazy" /></span>
            <span class="name">Block Tower</span>
        </a>
        <a class="game" href="./play.html?game=ufo">
            <span class="tile"><img src="./icons/ufo.webp" alt="" loading="lazy" /></span>
            <span class="name">UFO.io</span>
        </a>
    </div>
    <script>
        const button = document.querySelector('.settings-button');
        const menu = document.querySelector('.menu');
        const setOpen = (open) => { menu.hidden = !open; button.setAttribute('aria-expanded', String(open)); };
        button.addEventListener('click', (event) => { event.stopPropagation(); setOpen(menu.hidden); });
        document.addEventListener('click', (event) => { if (!menu.contains(event.target)) setOpen(false); });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') setOpen(false); });
    </script>
</body>
</html>
