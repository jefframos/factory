name: Publish Cached Games

on:
  push:
    branches: [main]
    paths:
      - 'cachedBuilds/**'

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: cachedBuilds

      - id: deployment
        uses: actions/deploy-pages@v4
